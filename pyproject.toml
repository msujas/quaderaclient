[build-system]
requires = ["setuptools >= 60.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quaderaclient"
version = "0.1.0"
requires-python = ">= 3.10"
dependencies = ["PyQt6"]
authors = [{name = "Kenneth P. Marshall", email = "kenneth.marshall@esrf.fr"}]
maintainers = [{name = "Kenneth P. Marshall", email = "kenneth.marshall@esrf.fr"}]
description = "A client for running a connecting to a custom TCP server on Quadera"
readme = {file = "README.MD", content-type = "text/markdown"}
keywords = ["mass spec", "Quadera"]
classifiers = [
"Programming Language :: Python :: 3.13"]

[project.scripts]
quaderagui = "quaderaclient.quaderaGUI:run"
quaderaexporter = 'quaderaclient.quaderaexporter:main'
